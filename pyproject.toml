[project]
name = "youtube-video-organizer"
version = "2.0.0"
description = "Local-first YouTube video organizer: playlist sync, theming, recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "yt-dlp>=2025.1.1",
    "google-api-python-client>=2.130,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["app", "app.ingest", "app.categorize", "app.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
